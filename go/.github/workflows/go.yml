name: Go

on:
  push:
    paths:
      - "go/**"
  pull_request:
    paths:
      - "go/**"

defaults:
  run:
    working-directory: go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build sidecar
        run: go build ./cmd/finscope-sidecar
      - name: Build MCP server
        run: go build ./cmd/finscope-mcp
